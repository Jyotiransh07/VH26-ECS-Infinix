name: LeakGuard

on:
  push:
  pull_request:

jobs:
  leakguard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install .
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

      - name: Self-Scan LeakGuard
        run: leakguard scan leakguard/
