name: LeakGuard

on:
  push:
  pull_request:

jobs:
  leakguard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LeakGuard
        run: pip install .

      - name: Run LeakGuard
        run: leakguard scan .
