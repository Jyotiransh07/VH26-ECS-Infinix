name: LeakGuard

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  leakguard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install .
          pip install pytest pytest-cov

      - name: Run Pytest
        run: pytest

      - name: Scan with LeakGuard (SARIF)
        run: leakguard scan sample-repo-python/ --format sarif > leakguard-results.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: leakguard-results.sarif

      - name: Scan with LeakGuard (Enforce Security Gate)
        run: leakguard scan sample-repo-python/

  deploy:
    runs-on: ubuntu-latest
    needs: leakguard # 🚨 THIS BLOCKS DEPLOYMENT IF LEAKGUARD FAILS
    steps:
      - name: Deploy to Production
        run: echo "🚀 Deploying to production server... (This will only run if LeakGuard passes!)"
